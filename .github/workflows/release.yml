name: release

# A release of pcbkit: started by PCBKit's `make release-cli` (never by a push or a pull request).
# The source is PCBKit's private repository: `SOURCE_URL` (a secret, a pre-signed link valid for a
# few hours, set by the release script just before) is a tarball with `src/` (the commit's source)
# and `web/` (the web viewer built from it). Nothing is cached between runs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (CalVer, e.g. 2026.10.28 or 2026.10.28.2)'
        required: true
      commit:
        description: 'PCBKit commit it is built from'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PCBKIT_VERSION: ${{ inputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      - name: Version
        run: echo "$PCBKIT_VERSION" | grep -Eq '^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'
      - name: Source
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          curl -fsSL --retry 3 -o source.tar.gz "$SOURCE_URL"
          tar -xzf source.tar.gz
          rm source.tar.gz
          test -f src/Cargo.toml && test -f web/index.html
      - name: Toolchain
        working-directory: src
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: src
        run: cargo build --locked --profile release -p pcbkit --target ${{ matrix.target }}
      - name: Package
        run: |
          exe=pcbkit; [ "${{ runner.os }}" = Windows ] && exe=pcbkit.exe
          mkdir -p pkg/bin pkg/share/pcbkit
          cp src/target/${{ matrix.target }}/release/$exe pkg/bin/
          cp -R web pkg/share/pcbkit/web
          cp cli/README.md cli/AGENTS.md cli/LICENSE.md pkg/
          python3 cli/.github/notices.py src ${{ matrix.target }} pkg/share/pcbkit/THIRD-PARTY-NOTICES.txt || python cli/.github/notices.py src ${{ matrix.target }} pkg/share/pcbkit/THIRD-PARTY-NOTICES.txt
          if [ "${{ runner.os }}" = Windows ]; then
            (cd pkg && 7z a -tzip -mx=9 ../pcbkit-${{ matrix.target }}.zip . > /dev/null)
          else
            tar -czf pcbkit-${{ matrix.target }}.tar.gz -C pkg .
          fi
          ls -l pcbkit-${{ matrix.target }}.*
      - name: Mesa (pictures without a GPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: |
          set -x
          p=$PWD/pkg/bin/pcbkit
          $p --version | grep -F "$PCBKIT_VERSION"
          mkdir smoke && cd smoke
          cp ../src/crates/pcbkit-core/src/interop/testdata/two-parts.brd .
          git config --global user.email ci@pcbkit.io && git config --global user.name ci
          $p import two-parts.brd > import.json || [ $? = 1 ]
          cd two-parts
          $p route > route.json || [ $? = 1 ]
          $p check > check.json || [ $? = 1 ]
          $p export --format fab --force --out fab > export.json
          $p render --out top.png > render.json || { cat render.json; echo "::warning::render failed on ${{ matrix.target }}"; }
          ls -l . fab
      - uses: actions/upload-artifact@v4
        with:
          name: pcbkit-${{ matrix.target }}
          path: pcbkit-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and manifest
        working-directory: dist
        run: |
          sha256sum pcbkit-* > SHA256SUMS
          cat SHA256SUMS
          python3 - <<'EOF'
          import json, os
          v, c = os.environ["VERSION"], os.environ["COMMIT"]
          base = f"https://github.com/pcbkit-io/cli/releases/download/v{v}/"
          assets = {}
          for line in open("SHA256SUMS"):
              sha, name = line.split()
              target = name.removeprefix("pcbkit-").removesuffix(".tar.gz").removesuffix(".zip")
              assets[target] = {"url": base + name, "sha256": sha, "size": os.path.getsize(name)}
          json.dump({"version": v, "commit": c, "tag": f"v{v}", "assets": assets}, open("manifest.json", "w"), indent=2)
          EOF
          cat manifest.json
      - name: Release
        run: |
          cat > notes.md <<EOF
          pcbkit $VERSION, built from PCBKit commit \`${COMMIT:0:12}\`.

          \`\`\`sh
          curl -fsSL https://pcbkit.io/install.sh | sh          # macOS, Linux
          irm https://pcbkit.io/install.ps1 | iex               # Windows (PowerShell)
          brew install pcbkit-io/tap/pcbkit                     # Homebrew
          \`\`\`

          Checksums: \`SHA256SUMS\`; machine-readable: \`manifest.json\` (version, commit, per-target URL, SHA-256, size).
          EOF
          gh release create "v$VERSION" dist/pcbkit-* dist/SHA256SUMS dist/manifest.json \
            --title "pcbkit $VERSION" --notes-file notes.md --target "${{ github.sha }}"
      - name: Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:pcbkit-io/homebrew-tap.git tap
          sha() { awk -v f="pcbkit-$1.tar.gz" '$2 == f {print $1}' dist/SHA256SUMS; }
          url() { echo "https://github.com/pcbkit-io/cli/releases/download/v$VERSION/pcbkit-$1.tar.gz"; }
          mkdir -p tap/Formula
          cat > tap/Formula/pcbkit.rb <<EOF
          # Generated by https://github.com/pcbkit-io/cli/blob/main/.github/workflows/release.yml
          class Pcbkit < Formula
            desc "Route, check, render and export circuit boards (KiCad, Altium, Eagle, EasyEDA)"
            homepage "https://github.com/pcbkit-io/cli"
            version "$VERSION"
            license :cannot_represent

            on_macos do
              on_arm do
                url "$(url aarch64-apple-darwin)"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$(url x86_64-apple-darwin)"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end
            on_linux do
              on_arm do
                url "$(url aarch64-unknown-linux-gnu)"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$(url x86_64-unknown-linux-gnu)"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "bin/pcbkit"
              (share/"pcbkit").install Dir["share/pcbkit/*"]
              doc.install "README.md", "AGENTS.md", "LICENSE.md"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/pcbkit --version")
            end
          end
          EOF
          cd tap
          git config user.name "pcbkit release" && git config user.email release@pcbkit.io
          git add Formula/pcbkit.rb
          git diff --cached --quiet || { git commit -q -m "pcbkit $VERSION" && git push -q origin HEAD:main; }
